[project]
name = "bootai"
version = "0.1.0"
description = "A cautious local file organizer with review-first, reversible workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn==0.50.2",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
]
web-test = [
    "httpx==0.28.1",
]
macos-launcher = [
    "pyobjc-core==12.2.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.1; sys_platform == 'darwin'",
]
macos-build = [
    "pillow==12.3.0",
    "pyinstaller==6.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"organizer.web" = [
    "templates/*.html",
    "static/THIRD_PARTY_NOTICES.txt",
    "static/css/*.css",
    "static/js/*.js",
    "static/loci_flow/*.css",
    "static/loci_flow/*.js",
    "static/loci_flow/*.json",
    "static/loci_flow/assets/*.svg",
    "static/vendor/*.css",
    "static/vendor/*.js",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# These two test files pin their own SHA-256 in the prototype contract tests,
# so lint and format must leave them byte-identical.
extend-exclude = ["tests/test_loci_flow_prototype.py", "tests/test_loci_flow_focused_prototype.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: ruff format owns line wrapping; long string literals are left as written.
# B905: strict= on zip changes error behaviour, so it is a separate decision.
# UP042: StrEnum changes str() output of existing enums.
ignore = ["E501", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test closures are created and used inside the same loop iteration.
"tests/**" = ["B023"]
